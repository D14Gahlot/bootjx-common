<!DOCTYPE html>
<html lang="en" class="loading">

<head>
<base th:href="${APP_CONTEXT} + '/'" />
<meta charset="UTF-8">
<title>Multi-Agent Dashboard</title>
<link rel="shortcut icon" type="image/x-icon" href="#" />  


<script>
  window.console = window.console || function(t) {};
  window.CONST = {
		CONTEXT: '[[${APP_CONTEXT}]]', "APP_USER" : '[[${APP_USER}]]',"APP_DEPT" : '[[${APP_DEPT}]]'
  }
</script>

<style type="text/css">
html {
    -webkit-transition: background-color 1s;
    transition: background-color 1s;
}
html, body ,.main-content-wrapper{
    min-height: 100%;
}
html.loading {
     background: #347fc3;
    /* Ensures that the transition only runs in one direction */
/*     -webkit-transition: background-color 0;
    transition: background-color 0; */
}

.main-content-wrapper {
    -webkit-transition: opacity 1s ease-in;
    transition: opacity 1s ease-in;
}
html.loading .main-content-wrapper {
    /* Make the contents of the body opaque during loading */
    opacity: 0;
    /* Ensures that the transition only runs in one direction */
    -webkit-transition: opacity 0;
    transition: opacity 0;
}
html .fullloader.bar {
    opacity: 0;
    -webkit-transition: opacity 0;
    transition: opacity 0;
    
    -webkit-transition: background-color 0;
    transition: background-color 0;
    
    -webkit-transition: opacity 1s ease-in;
    transition: opacity 1s ease-in;
    
    bottom: 0px;
    left: 0px;
    right: 0px;
    top: 0px;
    position: absolute;
}
html.loading .fullloader.bar {
    opacity: 1;
}

.container {
  height: 100vh;
  width: 100vw;
  font-family: Helvetica;
}

.loader {
  height: 20px;
  width: 250px;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  margin: auto;
}
.loader--dot {
  animation-name: loader;
  animation-timing-function: ease-in-out;
  animation-duration: 3s;
  animation-iteration-count: infinite;
  height: 20px;
  width: 20px;
  border-radius: 100%;
  background-color: black;
  position: absolute;
   border: 1px solid #ffffff;
   opacity: 0.2;
   background-color: #FFF;
  
}
.loader--dot:first-child {
/*   background-color: #8cc759; */
  animation-delay: 0.5s;
}
.loader--dot:nth-child(2) {
/*   background-color: #8c6daf;
 */  animation-delay: 0.4s;
}
.loader--dot:nth-child(3) {
/*   background-color: #ef5d74;
 */  animation-delay: 0.3s;
}
.loader--dot:nth-child(4) {
/*   background-color: #f9a74b;
 */  animation-delay: 0.2s;
}
.loader--dot:nth-child(5) {
/*   background-color: #60beeb;
 */  animation-delay: 0.1s;
}
.loader--dot:nth-child(6) {
/*   background-color: #fbef5a;
 */  animation-delay: 0s;
}
.loader--text {
  position: absolute;
  top: 200%;
  left: 0;
  right: 0;
  width: 4rem;
  margin: auto;
}
.loader--text:after {
  content: "Loading";
  font-weight: bold;
  animation-name: loading-text;
  animation-duration: 3s;
  animation-iteration-count: infinite;
  color : #FFF;
}

@keyframes loader {
  15% {
    transform: translateX(0);
  }
  45% {
    transform: translateX(230px);
  }
  65% {
    transform: translateX(230px);
  }
  95% {
    transform: translateX(0);
  }
}
@keyframes loading-text {
  0% {
    content: "Loading";
  }
  25% {
    content: "Loading.";
  }
  50% {
    content: "Loading..";
  }
  75% {
    content: "Loading...";
  }
}

</style>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">

<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.min.css">
<link rel="stylesheet" href="//www.w3schools.com/w3css/4/w3.css">

</head>
<body class="bcdesgin ">

<div class="fullloader bar container">
  <div class='loader'>
    <div class='loader--dot'></div>
    <div class='loader--dot'></div>
    <div class='loader--dot'></div>
    <div class='loader--dot'></div>
    <div class='loader--dot'></div>
    <div class='loader--dot'></div>
    <div class='loader--text'></div>
  </div>
</div>

<div class="main-content-wrapper">

		<!-- Sidebar -->
		<div class="w3-sidebar w3-bar-block w3-white w3-card w3-animate-left"
			style="display: none" id="mySidebar">
			<div class="mySidebar-container">
				<button
					class="w3-bar-item w3-large menu_btn_close fas fa-arrow-left">&nbsp;</button>
				<a href="auth/logout" class="w3-bar-item w3-button"><i
					class="fas fa-sign-out-alt"></i> Logout</a>
				<hr />
				<span theme="dashboard.agent.metalic" class="w3-bar-item w3-button"
					hidden><i class="fas fa-atom"></i> Metalic</span> <span
					theme="dashboard.agent.indigo" class="w3-bar-item w3-button" hidden><i
					class="fas fa-atom"></i> Indigo</span> <span
					theme="dashboard.agent.bubble" class="w3-bar-item w3-button" hidden><i
					class="fas fa-atom"></i> Bubble</span>
				<div class="sidebar-logo"></div>
			</div>
		</div>


		<div class="container-fluid h-100">
			<div class="row h-100">
				<div class="col-md-4 col-xl-3 chat">
					<div class="card mb-sm-3 mb-md-0 contacts_card card-shadow">
						<div class="card-header">
							<div class="input-group">
								<div class="input-group-prepend">
									<span class="input-group-text menu_btn"><i class="fas fa-bars"></i></span>
									<div class="action_menu menu_btn_menu">
										<ul>
											<li><i class="fas fa-user-circle"></i> View profile</li>
											<li><i class="fas fa-users"></i> Add to close friends</li>
											<li><i class="fas fa-plus"></i> Add to group</li>
											<li><i class="fas fa-ban"></i> Block</li>
										</ul>
									</div>
								</div>
								<input type="text" placeholder="Search..." name="" class="form-control search">
								<div class="input-group-prepend">
									<span class="input-group-text search_btn"><i class="fas fa-search"></i></span>
								</div>
							</div>
						</div>
						<div class="card-body contacts_body">
							<ui class="contacts contact-list">
								
							</ui>
							<ui class="contacts contact-list-unassigned">
								
							</ui>
						</div>
						<div class="card-footer">
							&nbsp;<span class="contact_type fa fa-facebook"></span>
							<span class="contact_type fa fa-whatsapp"></span>
							<span class="contact_type fa fa-twitter"></span>
							<span class="contact_type fa fa-telegram"></span>
							<span class="contact_type fa fa-chrome"></span>
							<span class="online-toggle fa fa-toggle-on"></span>
						</div>
					</div>
				</div>
				<div class="col-md-8 col-xl-6 chat">
					<div class="card card-shadow">
						<div class="card-header msg_head chat-head">
							<div class="d-flex bd-highlight">
								<div class="img_cont">
									<img src="assets/images/profile.png" class="rounded-circle user_img">
									<span class="online_icon" hidden></span>
								</div>
								<div class="user_info">
									<span class="user_name">...</span>
									<p class="user_text">...</p>
								</div>
								<div class="video_cam">
									<span><i class="fas fa-video" hidden></i></span>
									<span><i class="fas fa-phone" hidden></i></span>
								</div>
							</div>
							<span id="action_menu_btn" hidden><i class="fas fa-ellipsis-v"></i></span>
							<div class="action_menu">
								<ul>
									<li><i class="fas fa-user-circle"></i> View profile</li>
									<li><i class="fas fa-users"></i> Add to close friends</li>
									<li><i class="fas fa-plus"></i> Add to group</li>
									<li><i class="fas fa-ban"></i> Block</li>
								</ul>
							</div>
						</div>
						<div class="card-body msg_card_body">
							<div class="msg_card_body-bubbles">
									<div class="msg_card_body-logo"></div>
							</div>
							<div class="msg_card_body-panel">
								<hr/>
								<div class="msg_card_body-panel-tags">
								</div>
							</div>
						</div>
						<div class="card-body media_card_body hidden" >
							<div class="media_card_body-bubbles">
								
							</div>
							<div class="media_card_body-panel hidden">
								<hr/>
								<div class="media_card_body-panel-actions">
									<span class="media_cotainer_smart">Cancel</span>
									<span class="media_cotainer_smart">Send</span>
								</div>
							</div>
						</div>
						
						<div class="card-footer">
							<div class="input-group my-input-section fade" >
								<div class="input-group-append">
									<span class="input-group-text attach_btn"><i class="fas fa-paperclip"></i></span>
								</div>
								<textarea name="" class="form-control type_msg input-message" placeholder="Type your message..." autocomplete="off" disabled></textarea>
								<div class="input-group-append">
									<span class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></span>
								</div>
							</div>
						</div>
					</div>
				</div>
				
				
				<div class="col-md-4 col-xl-3 chat">
					<div class="card mb-sm-3 mb-md-0 card_contact_profile">

					</div>
				</div>
				
				
			</div>
		</div>

	</div>
	
<script type="text/tmpl" id="temp_contact_profile">
	<div class="card-header"></div>
	<div class="card-body">
		<div class="information" style="display: flex;">
			<img src="<%=c.img%>">
		</div>
    </div>
	<div class="card-footer">
			<div>
				<p><%=c.name%></p>
			</div>
			
			<%if(c.o.email){%><div>
				<p><span class="fa fa-envelope"/> <%=c.o.email%></p>
			</div><%}%>

			<%if(c.o.phone){%><div>
				<p><span class="fa fa-phone"/> <%=c.o.phone%></p>
			</div><%}%>

			<div id="listGroups">
				<h1></h1>
			</div>
	</div>
</script>


<script type="text/tmpl" id="temp_contact">
	<li class="<%=(c.o.assigned ? "data_assigned" : "data_unassigned")%>  " id="<%=c.contactId%>">
		<div class="d-flex bd-highlight contact-preview">
			<div class="img_cont">
				<img src="<%=c.img%>" class="rounded-circle user_img" alt="profilpicture">
					<span class="online_icon"></span>
<span class="contact_type fa <%=contactIcon%>"></span>
			</div>
			<div class="user_info contact-text">
				<span class="font-name" ><%=c.name%></span>
				<p class="font-preview" ><%=escape_HTML(lastmsg.text)%></p>
			</div>
			<div class="contact-time">
				<p><%=formatTime(lastmsg.time) %></p>
				<% if(c.newmsg>0){ %>
					<div class="new-message" id="nm<%=c.contactId%>"><p>&nbsp;</p></div>
				<%}%>	
			</div>
		</div>
	</li>
</script>
<script type="text/template" id="temp_message_me">
	<div class="d-flex justify-content-end mb-4 chat-bubble" data-local-id="<%=gc.localId%>" data-message-id="<%=gc.m.messageId%>">
		<div class="msg_cotainer_send">
			<% if(gc.m && !gc.m.messageId){ %><i class="sending fas fa-spinner fa-spin"></i><% } %>
			<%=formatMessage(gc.text)%>
			<% if(gc.m.attachments && gc.m.attachments.length>0) {%>
			<% if(gc.m && gc.m.template){ %><span class="fa fa-paperclip"></span>  <%=gc.m.template%><% } %>
			<div class="input-group my-attachments">
				<% for(var i in gc.m.attachments) {%>
				<img src="<%=getThumb(gc.m.attachments[i].mediaURL)%>" class="">
				<% } %>
			</div>
			<% } else { %>
			<% if(gc.m && gc.m.template){ %><span class="fa fa-tag"></span>  <%=gc.m.template%><% } %>
			<% } %>
			<span class="msg_time_send"><%=formatTime(gc.time)%>&nbsp;&nbsp;<span class="msg_user"><%=gc.name ||'---'%></span></span>
		</div>
		<div class="img_cont_msg">
			<img src="assets/images/profile.png" class="rounded-circle user_img_msg">
		</div>
	</div>
</script>
<script type="text/template" id="temp_message_you">
	<div class="d-flex justify-content-start mb-4 chat-bubble">
		<div class="img_cont_msg">
			<img src="assets/images/profile.png" class="rounded-circle user_img_msg">
		</div>
		<div class="msg_cotainer">
			<%=formatMessage(gc.text)%>
		</div>
		<span class="msg_time"><span class="msg_user"><%=gc.name ||'---'%></span>&nbsp;&nbsp;<%=formatTime(gc.time)%></span>
	</div>
</script>
	
<script type="text/template" id="temp_media_option">
<div class="media_card_body-bubbles-wrapper">
<% for(var i in list) { var media = list[i]; %>
	<div class="media_thumb">
			<input id="mdeia-<%=media.name%>" type="radio" name="media" value="<%=media.name%>" />
			<label class="media_thumb_label" for="mdeia-<%=media.name%>">
				<img src="<%=getThumb(media.url)%>">
			</label>
	</div>
<% } %>
</div>
</script>

</body>

</html>
