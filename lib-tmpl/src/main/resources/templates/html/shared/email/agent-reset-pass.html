<!doctype html>
<html lang="en-US">

<head>
	<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
	<title>Password Reset for [[${service}]] account</title>
	<meta name="description" content="Password Reset Email">
	<style type="text/css">
		a:hover {
			text-decoration: underline!important;
		}
        .ExternalClass {width: 100%;}
	</style>
</head>

<body marginheight="0" topmargin="0" marginwidth="0" style="margin: 0px; background-color: #f2f3f8;" bgcolor="#f2f3f8" leftmargin="0">
	<style type="text/css">
		a:hover {
			text-decoration: underline!important;
		}
        .ExternalClass {width: 100%;}
	</style>

	<!--100% body table-->
	<table cellspacing="0" border="0" cellpadding="0" width="100%" bgcolor="#f2f3f8" style="">
		<tr>
			<td>
				<table style="background-color: #f2f3f8; max-width: 670px; margin: 0 auto;" width="100%" border="0"
					align="center" cellpadding="0" cellspacing="0">
					<tr>
						<td style="height: 80px; min-height: 80px;">&nbsp;</td>
					</tr>
					<tr>
						<td style="text-align: center;"><a th:href="'https://' + ${website}" title="logo"
								target="_blank">
								<img width="60" th:src="${logo}" title="logo" alt="logo">
							</a></td>
					</tr>
					<tr>
						<td style="height: 20px;min-height: 20px;">&nbsp;</td>
					</tr>
					<tr>
						<td>
							<table width="95%" border="0" align="center" cellpadding="0" cellspacing="0"
								style="max-width: 670px; background: #fff; border-radius: 3px; text-align: center;" bgcolor="#fff">
								<tr>
									<td style="height: 40px;min-height: 40px;">&nbsp;</td>
								</tr>
								<tr>
									<td style="padding: 0 35px;">
										<h1
											style="color: #1e1e2d; font-weight: 500; margin: 0; font-size: 32px; font-family: 'Rubik', sans-serif;">
											You have requested to reset your password</h1> <span
											style="vertical-align: middle; margin: 29px 0 26px; border-bottom: 1px solid #cecece; width: 100px;"></span>
										<div  style="height: 20px; min-height: 20px;">&nbsp;</div>
										<p style="color: #455056; font-size: 15px; line-height: 24px; margin: 0; mso-line-height-rule:exactly;">
											We cannot simply send you your old password. A unique link to
											reset your password has been generated for you. To reset your
											password, click the following link and follow the
											instructions.</p> 
										<div  style="height: 20px; min-height: 20px;">&nbsp;</div>
										<p>
										<a  
											th:href="${link}"
											bgcolor="#2e207d"
											style="background: #2e207d; text-decoration: none; font-weight: 500; margin-top: 35px; color: #fff; text-transform: uppercase; font-size: 14px; padding: 10px 24px; border-radius: 50px;">
											Reset password</a>
										</p>
									</td>
								</tr>
								<tr>
									<td style="height: 40px; min-height: 40px;">&nbsp;</td>
								</tr>
							</table>
						</td>
					<tr>
						<td style="height: 20px; min-height: 20px;">&nbsp;</td>
					</tr>
					<tr>
						<td style="text-align: center;">
							<p
								style="font-size: 14px; color: #455056; line-height: 18px; margin: 0 0 0; mso-line-height-rule:exactly;">
								&copy; <b>[[${website}]]</b>
							</p>
						</td>
					</tr>
					<tr>
						<td style="height: 80px; min-height: 80px;">&nbsp;</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
	<!--/100% body table-->
</body>

</html>
