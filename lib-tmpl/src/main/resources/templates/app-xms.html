<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

    <title>[[${CONFIG.PROP_SERVICE_NAME}]] API Dashboard</title>
    <link rel="shortcut icon" th:href="${CDN_URL}+'/favicon.ico'" />
    <style>
    html,
	body {
	  height: 100%;
	}
	
	body {
	  padding-top: 5rem;
	  background-color: #f5f5f5;
	}
	
	.form-signin {
	  max-width: 25rem;
	  margin: auto;
	}
    </style>
  </head>
  <body class="text-center">
    <main class="form-signin">
      <form method="POST">
        <img class="mb-4" th:src="${CDN_URL}+'/_common/static/xms-logo.png'" alt="" height="300">
        <h1 class="h3 mb-3 fw-normal"><b>[[${CONFIG.PROP_SERVICE_NAME}]] API Dashboard</b> - Login</h1>
    
        <div class="form-floating">
          <input type="text" class="form-control" id="apiId" placeholder="" name="swagger.auth.apiId">
          <label for="apiId">API ID</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="apiKey" placeholder="" name="swagger.auth.apiKey">
          <label for="apiKey">API Key</label>
        </div>
    
        <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">Login</button>
        <p class="mt-5 mb-3 text-muted"></p><a th:href='${CONFIG.PROP_SERVICE_WEBSITE_LINK}' th:text="'Copyright © 2022 ' + ${CONFIG.PROP_SERVICE_NAME}"></a></p>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.16/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
  </body>
</html>
