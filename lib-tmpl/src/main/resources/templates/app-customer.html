<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3" class="loadable loading">
<head>
<meta charset=utf-8>
<meta http-equiv=X-UA-Compatible content="IE=edge">
<meta name=viewport
	content="width=device-width,initial-scale=1,shrink-to-fit=no">
<link rel="shortcut icon" th:href="${CDN_URL}+'/favicon.ico'" />
<title>Support</title>

<style type="text/css">
:root {
    --scheme-color: [[${POSTMAN_AGENT_SCHEME_COLOR}]];
}
</style>

<style type="text/css">
html.loadable {
    -webkit-transition: background-color 0.5s;
    transition: background-color 0.5s;
}

body {
	background :  transparent!important;
	margin:0px;
}
html.loadable .fullloader {
	display: flex;
    justify-content: center;
    align-items: center;
    margin: auto;
    height: 100vh;
    z-index:10000;
}
html.loadable .fullloader {
	visibility: hidden;
	opacity : 0;
	transition: opacity 0.5s ease, visibility 0s ease 0.5s;
}
html.loadable.loading .fullloader {
    visibility: visible;
  	opacity: 1;
  	transition: opacity 0.5s ease 0s, visibility 0s ease 0s;
}

.lds-ellipsis {
  display: inline-block;
  position: relative;
  width: 60px;
  height: 60px;
  z-index:10000;
}
.lds-ellipsis div {
  position: absolute;
  top: 26px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #fff;
  animation-timing-function: cubic-bezier(0, 1, 1, 0);
}
.lds-ellipsis div:nth-child(1) {
  left: 2px;
  animation: lds-ellipsis1 0.6s infinite;
}
.lds-ellipsis div:nth-child(2) {
  left: 2px;
  animation: lds-ellipsis2 0.6s infinite;
}
.lds-ellipsis div:nth-child(3) {
  left: 20px;
  animation: lds-ellipsis2 0.6s infinite;
}
.lds-ellipsis div:nth-child(4) {
  left: 37px;
  animation: lds-ellipsis3 0.6s infinite;
}
@keyframes lds-ellipsis1 {
  0% {
    transform: scale(0);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes lds-ellipsis3 {
  0% {
    transform: scale(1);
  }
  100% {
    transform: scale(0);
  }
}
@keyframes lds-ellipsis2 {
  0% {
    transform: translate(0, 0);
  }
  100% {
    transform: translate(24px, 0);
  }
}



</style>


<div th:switch="${CDN_DEBUG}" th:remove="tag">
	<p th:case="'true'" th:remove="tag">
		<meta name=report th:content="${CDN_DEBUG}">
	</p>
	<p th:case="*" th:remove="tag">
		<link rel=stylesheet
			href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
		
		<!-- // preload  css and js -->
		<link th:href="${CDN_URL} + '/app-customer.js?_='+${CDN_VERSION}" rel=preload
			as=script>
		<link th:href="${CDN_URL} + '/css/chunk-common.css?_='+${CDN_VERSION}"
			rel=preload as=style>
		<link th:href="${CDN_URL} + '/js/chunk-vendors.js?_='+${CDN_VERSION}"
			rel=preload as=script>
		<link th:href="${CDN_URL} + '/js/chunk-common.js?_='+${CDN_VERSION}"
			rel=preload as=script>
			
		<!-- // load  css -->
		<link
			th:href="${CDN_URL} + '/css/chunk-vendors.css?_='+${CDN_VERSION}"
			rel=stylesheet>
		<link th:href="${CDN_URL} + '/css/chunk-common.css?_='+${CDN_VERSION}"
			rel=stylesheet />

	</p>
</div>


<script th:inline="text" >
	window.CONST = {
		TENANT : '[[${TENANT}]]',
		dev : '[[${CDN_DEBUG}]]',
		CDN_URL : '[[${CDN_URL}]]', //
		APP_CONTEXT : '[[${APP_CONTEXT}]]', //
		remoteJsVersion : '[[${CDN_VERSION}]]', //
		CONTEXT: '[[${APP_CONTEXT}]]',
		CONFIG : ([(${CONFIG_JSON})]),
		WEBAPP_BASE : '[[${WEBAPP_BASE}]]',
		POSTMAN : '[[${POSTMAN_CONTEXT}]]',
		NOUNCE : '[[${NOUNCE}]]',
		APP_USER : '[[${APP_USER}]]',
	};
	var initFingerprintJS = function initFingerprintJS() {
		FingerprintJS.load().then(fp => {
		      fp.get().then(result => {
		    	  window.CONST.fp = result.visitorId;
		    	    
		      });
		});
	}
</script>
</head>
<body>
	<noscript>
		<strong>We're sorry but ArchitectUI doesn't work properly
			without JavaScript enabled. Please enable it to continue.</strong>
	</noscript>
	<div class="fullloader">
		 <div class="loader lds-ellipsis"><div></div><div></div><div></div><div></div></div>
	</div>

	<div id=app></div>

<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js'></script>	
<script th:src="${CDN_URL}+'/_common/lib/sockjs.min.js'"></script>
<script th:src="${CDN_URL}+'/_common/lib/stomp.4.0.8.min.js'"></script>
<script th:src="${CDN_URL}+'/_common/lib/tunnel.client.js'"></script>
<script async src="//cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"
  onload="initFingerprintJS()"></script>

<div th:switch="${CDN_DEBUG}" th:remove="tag"> 
  <p th:case="'true'" th:remove="tag">
  		<!-- // load  js if debug -->
		<script th:src="${CDN_URL}+'/app-customer.js?_='+${CDN_VERSION}"></script>
  </p>
  <p th:case="*" th:remove="tag">
  		<!-- // load  js if prod -->
  	  	<script th:src="${CDN_URL}+'/js/chunk-vendors.js?_='+${CDN_VERSION}"></script>
  	  	<script th:src="${CDN_URL}+'/js/chunk-common.js?_='+${CDN_VERSION}"></script>
		<script th:src="${CDN_URL}+'/app-customer.js?_='+${CDN_VERSION}"></script>
  </p> 
</div>

</body>

</html>
