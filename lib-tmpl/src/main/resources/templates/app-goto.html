<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
	<meta charset=utf-8>
	<meta http-equiv=X-UA-Compatible content="IE=edge">
	<meta name=viewport content="width=device-width,initial-scale=1,shrink-to-fit=no">

	<link rel="shortcut icon" th:href="${CDN_URL}+'/favicon.ico'" />

	<title>[[${CONFIG.PROP_SERVICE_NAME}]] - Account</title>


	<script>
		window.CONST = {
			TENANT : '[[${TENANT}]]',
			dev: '[[${CDN_DEBUG}]]',
			CDN_URL: '[[${CDN_URL}]]', //
			APP_CONTEXT: '[[${APP_CONTEXT}]]', APP: '[[${APP}]]', //
			remoteJsVersion: '[[${CDN_VERSION}]]', //
			CONTEXT: '[[${APP_CONTEXT}]]', "APP_USER": '[[${APP_USER}]]', "APP_DEPT": '[[${APP_DEPT}]]', "APP_USER_ROLE": '[[${APP_USER_ROLE}]]',
			CONFIG: [(${CONFIG_JSON})]
		};
	</script>
</head>

<body>
	<noscript>
		<strong>We're sorry but ArchitectUI doesn't work properly
			without JavaScript enabled. Please enable it to continue.</strong>
	</noscript>
	<div id=app>
		<form th:action="${FORM_URL}" method="POST" name="login">
			<input type="hidden" name="domainName" th:value="${DOMAIN_NAME}" />
			<input type="hidden" name="domainUser" th:value="${DOMAIN_USER}" />
			<input type="hidden" name="domainId" th:value="${DOMAIN_ID}" />
			<input type="hidden" name="domainToken" th:value="${DOMAIN_TOKEN}" />
			<button type="submit">Redirecting...</button>
		</form>
	</div>

	<script type="text/javascript">
		window.onload = function(){
	  		document.forms['login'].submit();
		}
	</script>
</body>





</html>
