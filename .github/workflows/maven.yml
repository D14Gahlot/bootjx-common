name: Java CI with Maven

on:
  push:
    branches:
      - build-xyz-upgrade
  pull_request:
    branches:
      - build-xyz-upgrade

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK 11 (or whatever version your project needs)
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'

      # Install dependencies and run tests
      - name: Build with Maven
        run: mvn clean install test  -pl server-test  -am -U --batch-mode
