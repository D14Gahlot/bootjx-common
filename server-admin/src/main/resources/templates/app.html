<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
<meta charset=utf-8>
<meta http-equiv=X-UA-Compatible content="IE=edge">
<meta name=viewport
	content="width=device-width,initial-scale=1,shrink-to-fit=no">

<link rel="shortcut icon" th:href="${CDN_URL}+'/favicon.ico'" />

<title>Mehery - Admin</title>

<div th:switch="${CDN_DEBUG}" th:remove="tag"> 
  <p th:case="'true'" th:remove="tag">
		<meta name=report th:content="${CDN_DEBUG}">
  </p>
  <p th:case="*" th:remove="tag">
	<link rel=stylesheet
		href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
	<link th:href="${CDN_URL} + '/app.js?_='+${CDN_VERSION}" rel=preload as=script>
	<link th:href="${CDN_URL} + '/css/app.css?_='+${CDN_VERSION}" rel=preload as=style>
	<link th:href="${CDN_URL} + '/js/chunk-vendors.js?_='+${CDN_VERSION}" rel=preload
		as=script>
	<link th:href="${CDN_URL} + '/css/app.css?_='+${CDN_VERSION}" rel=stylesheet>
  </p> 
</div>



<script>
	window.CONST = {
		dev : '[[${CDN_DEBUG}]]',
		CDN_URL : '[[${CDN_URL}]]', //
		APP_CONTEXT : '[[${APP_CONTEXT}]]', //
		remoteJsVersion :  '[[${CDN_VERSION}]]', //
		CONTEXT: '[[${APP_CONTEXT}]]', "APP_USER" : '[[${APP_USER}]]'
	};
</script>
</head>
<body>
	<noscript>
		<strong>We're sorry but ArchitectUI doesn't work properly
			without JavaScript enabled. Please enable it to continue.</strong>
	</noscript>
	<div id=app></div>
	
<div th:switch="${CDN_DEBUG}" th:remove="tag"> 
  <p th:case="'true'" th:remove="tag">
		<script th:src="${CDN_URL}+'/app.js?_='+${CDN_VERSION}"></script>
  </p>
  <p th:case="*" th:remove="tag">
  	  	<script th:src="${CDN_URL}+'/js/chunk-vendors.js?_='+${CDN_VERSION}"></script>
		<script th:src="${CDN_URL}+'/app.js?_='+${CDN_VERSION}"></script>
  </p> 
</div>


</body>





</html>
